<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Portfolio Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="top">
    <div class="top-title"><span class="logo">cg</span> Portfolio admin</div>
    <div class="top-right">
      <span class="status" id="status" role="status">Loading…</span>
      <a class="btn" href="index.html" target="_blank" rel="noopener"><i class="ph ph-arrow-square-out"></i>Open website</a>
    </div>
  </header>

  <div class="layout">
    <aside class="side" aria-label="Sections">
      <button class="side-item" data-view="profile"><i class="ph ph-user-circle"></i>Profile and contact</button>
      <p class="side-head">Clients</p>
      <ul class="client-list" id="clientList"></ul>
      <button class="btn btn-primary btn-block" id="addClient"><i class="ph ph-plus"></i>Add client</button>
    </aside>
    <main class="main" id="main"></main>
  </div>

  <div class="busy" id="busy" hidden><div class="busy-box"><i class="ph ph-spinner"></i><span id="busyText">Working…</span></div></div>

  <div class="blocked" id="blocked" hidden>
    <div class="blocked-box">
      <h1>Start the admin with Admin.bat</h1>
      <p>This page needs the small helper that saves your changes. Close this tab, then double-click <b>Admin.bat</b> in the portfolio folder. The admin opens in your browser automatically.</p>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
